# dsh-sidebar-expand-all bundle patch
#
# 这是 npm 包里的 `dsh.bundle.patch` 层。用官方命令安装时——
#
#   dsh plugin --profile desktop add dsh-sidebar-expand-all
#
# ——命令会把这个包追加进 profile 的 bundle 栈（`dsh.profile.bundles`），
# 本文件里的单行 `insert` 就是插件挂载行；profile 不需要手改。
#
# 插件本身不改 UI、不注册 client bundle：侧栏行为由它对 app.asar 内
# dsh-client-ui-workspace 的两处等长补丁提供，应用后需重启 DSH 生效。
- insert:
    - id: sidebar-expand-all
      name: 'dsh-sidebar-expand-all'
